<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/theme.css">
    <title>Saúde Piracicaba - Login e Cadastro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--page-bg); color: var(--page-text); }
        .glass { background: var(--surface); backdrop-filter: blur(12px); border: 1px solid var(--border); }
        .input-focus:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; }
        .tab-inactive { border-bottom: 2px solid transparent; color: #94a3b8; }
        #sidebar-overlay { transition: opacity 0.3s ease; }
        #sidebar-drawer { transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1); left:0 !important; margin-left:0 !important; }
    </style>
    <link rel="stylesheet" href="css/settings.css">
</head>
<body class="min-h-screen">
    <script>(function(){try{var s=JSON.parse(localStorage.getItem('saudepira-settings-v1'));if(s&&s.theme==='light'){document.body.classList.add('theme-light');}}catch(e){}})();</script>
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-50 opacity-0 pointer-events-none" onclick="closeNavSidebar()"></div>
    <aside id="sidebar-drawer" class="fixed top-0 left-0 h-full w-72 z-50 flex flex-col -translate-x-full border-r border-white/10 overflow-y-auto" style="background:rgba(2,6,23,0.98);backdrop-filter:blur(20px);">
        <div class="flex items-center justify-end p-5 border-b border-white/10 flex-shrink-0">
            <button onclick="closeNavSidebar()" class="text-slate-400 hover:text-white transition-colors" aria-label="Fechar menu">
                <i class="ph-bold ph-x text-xl"></i>
            </button>
        </div>
        <nav class="flex-1 p-4 flex flex-col gap-1">
            <span class="text-xs font-semibold text-slate-500 uppercase tracking-widest px-3 mb-1 mt-2">Navegação</span>
            <a href="index3.html" class="flex items-center gap-3 px-3 py-3 rounded-xl bg-blue-500/10 text-blue-400 font-medium">
                <i class="ph-bold ph-house text-xl"></i> <span>Início</span>
            </a>
            <a href="mapa_definitivo.html" class="flex items-center gap-3 px-3 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition-colors font-medium">
                <i class="ph-bold ph-map-trifold text-xl"></i> <span>Ver Mapa</span>
            </a>
            <a href="curiosidades.html" class="flex items-center gap-3 px-3 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition-colors font-medium">
                <i class="ph-bold ph-list-bullets text-xl"></i> <span>Curiosidades</span>
            </a>
            <a href="medicamentos.html" class="flex items-center gap-3 px-3 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition-colors font-medium">
                <i class="ph-bold ph-pill text-xl"></i> <span>Anotar Medicamentos</span>
            </a>
            <a href="sobre_nos.html" class="flex items-center gap-3 px-3 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition-colors font-medium">
                <i class="ph-bold ph-users text-xl"></i> <span>Sobre nós</span>
            </a>
            <a href="contato.html" class="flex items-center gap-3 px-3 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition-colors font-medium">
                <i class="ph-bold ph-envelope text-xl"></i> <span>Contato</span>
            </a>
        </nav>
    </aside> 

    <header class="fixed top-0 left-0 right-0 z-40 px-4 py-4 flex items-center justify-between bg-slate-950/70 backdrop-blur-xl border-b border-white/10">
        <button onclick="openNavSidebar()" class="text-slate-300 hover:text-white transition-colors" aria-label="Abrir menu">
            <i class="ph-bold ph-list text-2xl"></i>
        </button>
        <a href="index3.html" class="flex items-center gap-2 text-white">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                <i class="ph-bold ph-activity text-white"></i>
            </div>
            <span class="font-bold text-lg">Saúde<span class="text-blue-500">Pira</span></span>
        </a>
        <div class="w-8"></div>
    </header>

    <div class="min-h-screen flex items-center justify-center px-4 pt-24 pb-8">

    <div class="fixed inset-0 -z-10">
        <div class="absolute top-0 right-0 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl"></div>
        <div class="absolute bottom-0 left-0 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl"></div>
    </div>

    <div class="w-full max-w-md">
        <div class="flex items-center justify-center gap-3 mb-12">
            <div class="w-12 h-12 bg-blue-600 rounded-lg flex items-center justify-center">
                <i class="ph-bold ph-activity text-white text-2xl"></i>
            </div>
            <span class="font-bold text-2xl">Saúde<span class="text-blue-500">Pira</span></span>
        </div>

        <div class="glass rounded-3xl p-8 backdrop-blur-xl">
            <div class="flex gap-6 mb-8 border-b border-white/10">
                <button id="tab-login" class="pb-3 font-semibold transition-all tab-active" onclick="switchTab('login')">
                    <i class="ph ph-sign-in mr-2"></i>Entrar
                </button>
                <button id="tab-signup" class="pb-3 font-semibold transition-all tab-inactive" onclick="switchTab('signup')">
                    <i class="ph ph-user-plus mr-2"></i>Cadastrar
                </button>
            </div>

            <div id="login-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Email</label>
                    <input id="login-email" type="email" placeholder="seu@email.com" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-500 transition-all input-focus">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Senha</label>
                    <input id="login-password" type="password" placeholder="••••••••" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-500 transition-all input-focus">
                </div>
                <div class="text-right mt-2">
                    <a href="recuperar_senha.html" class="text-sm text-blue-400 hover:text-blue-300">Esqueci minha senha</a>
                </div>
                <div id="login-error" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-xl text-sm"></div>
                <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-semibold transition-all text-white mt-6">
                    Entrar
                </button>
                <p class="text-center text-slate-400 text-sm">
                    Não tem conta? <button onclick="switchTab('signup')" class="text-blue-400 hover:text-blue-300 font-semibold transition-colors">Cadastre-se</button>
                </p>
            </div>

            <div id="signup-form" class="hidden space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Nome Completo</label>
                    <input id="signup-name" type="text" placeholder="João Silva" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-500 transition-all input-focus">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Email</label>
                    <input id="signup-email" type="email" placeholder="seu@email.com" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-500 transition-all input-focus">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Senha</label>
                    <input id="signup-password" type="password" placeholder="••••••••" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-500 transition-all input-focus">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Confirmar Senha</label>
                    <input id="signup-password-confirm" type="password" placeholder="••••••••" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-500 transition-all input-focus">
                </div>
                <div id="signup-error" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-xl text-sm"></div>
                <div id="signup-success" class="hidden bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-4 py-3 rounded-xl text-sm flex items-center gap-2">
                    <i class="ph ph-check-circle"></i>
                    <span></span>
                </div>
                <button onclick="handleSignup()" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-semibold transition-all text-white mt-6">
                    Criar Conta
                </button>
                <p class="text-center text-slate-400 text-sm">
                    Já tem conta? <button onclick="switchTab('login')" class="text-blue-400 hover:text-blue-300 font-semibold transition-colors">Entre aqui</button>
                </p>
            </div>

            <div class="mt-10 pt-8 border-t border-white/10 space-y-3">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest">Benefícios:</p>
                <div class="space-y-2 text-sm text-slate-400">
                    <div class="flex items-center gap-2"><i class="ph ph-check text-blue-400"></i><span>Salve prescrições</span></div>
                    <div class="flex items-center gap-2"><i class="ph ph-check text-blue-400"></i><span>Favorite unidades</span></div>
                </div>
            </div>
        </div>

        <div class="text-center mt-6">
            <a href="index3.html" class="text-slate-400 hover:text-white transition-colors text-sm font-medium flex items-center justify-center gap-2">
                <i class="ph ph-arrow-left"></i>Voltar para Home
            </a>
        </div>
    </div>

    <script>
        function setActiveNavLink() {
            const currentPage = window.location.pathname.split('/').pop().toLowerCase();
            document.querySelectorAll('#sidebar-drawer a[href]').forEach((link) => {
                const href = (link.getAttribute('href') || '').toLowerCase();
                const isActive = href === currentPage;
                link.classList.toggle('bg-blue-500/10', isActive);
                link.classList.toggle('text-blue-400', isActive);
                link.classList.toggle('text-slate-300', !isActive);
                link.classList.toggle('hover:bg-white/5', !isActive);
                link.classList.toggle('font-medium', true);
            });
        }

        function openNavSidebar() {
            const overlay = document.getElementById('sidebar-overlay');
            const drawer = document.getElementById('sidebar-drawer');
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            overlay.classList.add('opacity-100');
            drawer.classList.remove('-translate-x-full');
            drawer.classList.add('translate-x-0');
        }

        function closeNavSidebar() {
            const overlay = document.getElementById('sidebar-overlay');
            const drawer = document.getElementById('sidebar-drawer');
            overlay.classList.add('opacity-0', 'pointer-events-none');
            overlay.classList.remove('opacity-100');
            drawer.classList.add('-translate-x-full');
            drawer.classList.remove('translate-x-0');
        }

        window.openNavSidebar = openNavSidebar;
        window.closeNavSidebar = closeNavSidebar;
        setActiveNavLink();

        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                tabLogin.classList.replace('tab-inactive', 'tab-active');
                tabSignup.classList.replace('tab-active', 'tab-inactive');
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                tabLogin.classList.replace('tab-active', 'tab-inactive');
                tabSignup.classList.replace('tab-inactive', 'tab-active');
            }
        }

        async function handleLogin() {
            const email = document.getElementById('login-email').value.trim();
            const senha = document.getElementById('login-password').value;
            const errorDiv = document.getElementById('login-error');

            errorDiv.classList.add('hidden');

            if (!email || !senha) {
                errorDiv.textContent = 'Preencha todos os campos.';
                errorDiv.classList.remove('hidden');
                return;
            }

            const formData = new FormData();
            formData.append('acao', 'logar');
            formData.append('email', email);
            formData.append('senha', senha);

            try {
                // ALTERADO: Aponta diretamente para o arquivo PHP
                const response = await fetch('processar_login.php', { method: 'POST', body: formData });
                const result = await response.json();

                if (result.success) {
                    sessionStorage.setItem('currentUser', JSON.stringify(result.user));
                    window.location.href = 'index3.html';
                } else {
                    errorDiv.textContent = result.message;
                    errorDiv.classList.remove('hidden');
                }
            } catch (e) {
                errorDiv.textContent = 'Erro ao conectar com o servidor.';
                errorDiv.classList.remove('hidden');
            }
        }

        async function handleSignup() {
            const nome = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const senha = document.getElementById('signup-password').value;
            const confirm = document.getElementById('signup-password-confirm').value;
            const errorDiv = document.getElementById('signup-error');
            const successDiv = document.getElementById('signup-success');

            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');

            if (!nome || !email || !senha || !confirm) {
                errorDiv.textContent = 'Preencha todos os campos.';
                errorDiv.classList.remove('hidden');
                return;
            }

            if (senha !== confirm) {
                errorDiv.textContent = 'As senhas não coincidem.';
                errorDiv.classList.remove('hidden');
                return;
            }

            const formData = new FormData();
            formData.append('acao', 'cadastrar');
            formData.append('nome', nome);
            formData.append('email', email);
            formData.append('senha', senha);

            try {
                // ALTERADO: Aponta diretamente para o arquivo PHP
                const response = await fetch('processar_login.php', { method: 'POST', body: formData });
                const result = await response.json();

                if (result.success) {
                    successDiv.querySelector('span').textContent = 'Conta criada com sucesso!';
                    successDiv.classList.remove('hidden');
                    setTimeout(() => window.location.reload(), 2000);
                } else {
                    errorDiv.textContent = result.message;
                    errorDiv.classList.remove('hidden');
                }
            } catch (e) {
                errorDiv.textContent = 'Erro ao processar cadastro.';
                errorDiv.classList.remove('hidden');
            }
        }

        if (sessionStorage.getItem('currentUser')) {
            window.location.href = 'index3.html';
        }
    </script>
    <script src="js/settings.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/accessibility.js"></script>
    <script src="js/settings-ui.js"></script>
</body>
</html>
