<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Unidades - Saúde Piracicaba</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #0f172a 0%, #0b1120 100%);
        }
        .glass {
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(148, 163, 184, 0.12);
        }
        .card-hover:hover {
            transform: translateY(-3px);
            border-color: rgba(59, 130, 246, 0.45);
        }
        .chip {
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid rgba(148, 163, 184, 0.12);
        }
        .category-panel {
            scroll-margin-top: 120px;
        }
    </style>
</head>
<body class="min-h-screen text-slate-100">
    <header class="sticky top-0 z-30 border-b border-white/10 bg-slate-950/80 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
            <div>
                <p class="text-xs uppercase tracking-[0.35em] text-blue-300">Catálogo</p>
                <h1 class="text-2xl md:text-3xl font-bold">Unidades de Saúde</h1>
            </div>
            <div class="flex items-center gap-3 w-full md:max-w-xl">
                <div class="flex-1 flex items-center gap-2 rounded-2xl border border-white/10 bg-white/5 px-4 py-3">
                    <i class="ph ph-magnifying-glass text-slate-400"></i>
                    <input id="searchInput" type="search" placeholder="Buscar unidade, endereço ou especialidade..." class="w-full bg-transparent outline-none text-sm placeholder-slate-500">
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-10">
        <section class="mb-8">
            <p class="text-slate-300 leading-relaxed max-w-3xl">
                Aqui você encontra todas as unidades cadastradas no site, organizadas por tipo de serviço para facilitar a navegação e o entendimento de cada atendimento.
            </p>
        </section>

        <section id="categoryNav" class="mb-8 flex flex-wrap gap-2"></section>
        <section id="catalogContent" class="space-y-10"></section>
    </main>

    <script>
        const categoriaConfig = {
            'UBS': {
                titulo: 'UBS',
                subtitulo: 'Unidades Básicas de Saúde',
                descricao: 'Atenção primária, consultas básicas, prevenção e acompanhamento contínuo da saúde da população.',
                cor: 'from-blue-500 to-cyan-500'
            },
            'USF': {
                titulo: 'USF',
                subtitulo: 'Unidades de Saúde da Família',
                descricao: 'Atendimento com equipe multiprofissional, com foco na prevenção, acompanhamento familiar e cuidado próximo.',
                cor: 'from-emerald-500 to-green-500'
            },
            'UPA / Urgência': {
                titulo: 'UPA / Urgência',
                subtitulo: 'Atendimento imediato',
                descricao: 'Serviços de urgência e emergência para situações que exigem resposta rápida e suporte especializado.',
                cor: 'from-rose-500 to-orange-500'
            },
            'Farmácia': {
                titulo: 'Farmácia',
                subtitulo: 'Dispensação e apoio farmacêutico',
                descricao: 'Acesso a medicamentos, orientações sobre uso e suporte ao tratamento.',
                cor: 'from-lime-500 to-emerald-500'
            },
            'COTE': {
                titulo: 'COTE',
                subtitulo: 'Central de Regulação',
                descricao: 'Organização e apoio à regulação das vagas e orientação sobre o acesso aos serviços.',
                cor: 'from-violet-500 to-fuchsia-500'
            },
            'SAMU': {
                titulo: 'SAMU',
                subtitulo: 'Atendimento móvel de urgência',
                descricao: 'Resgate e atendimento pré-hospitalar para situações urgentes e emergenciais.',
                cor: 'from-red-500 to-pink-500'
            },
            'Urgência Bucal': {
                titulo: 'Urgência Bucal',
                subtitulo: 'Atendimento odontológico imediato',
                descricao: 'Assistência para dor, traumas e urgências bucais.',
                cor: 'from-amber-500 to-yellow-500'
            },
            'Serviços Especializados': {
                titulo: 'Serviços Especializados',
                subtitulo: 'Exames, reabilitação e apoio especializado',
                descricao: 'Unidades voltadas a atendimentos específicos, exames, apoio terapêutico e cuidado especializado.',
                cor: 'from-sky-500 to-indigo-500'
            },
            'Programas e Apoio': {
                titulo: 'Programas e Apoio',
                subtitulo: 'Acompanhamento social e educacional',
                descricao: 'Serviços voltados ao cuidado integral, prevenção e apoio às necessidades sociais da população.',
                cor: 'from-slate-500 to-zinc-500'
            },
            'Outros Serviços': {
                titulo: 'Outros Serviços',
                subtitulo: 'Demais unidades cadastradas',
                descricao: 'Unidades complementares que oferecem suporte à rede de saúde.',
                cor: 'from-slate-500 to-slate-600'
            }
        };

        let todasUnidades = [];

        function normalizarTexto(texto) {
            return String(texto || '')
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9\s]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function definirCategoria(unidade) {
            const nome = normalizarTexto(unidade.nome || '');
            const especialidades = normalizarTexto(unidade.especialidades || '');
            const localizacao = normalizarTexto(unidade.localizacao || '');

            if (nome.includes('cote')) return 'COTE';
            if (nome.includes('samu')) return 'SAMU';
            if (nome.includes('sub')) return 'Urgência Bucal';
            if (nome.includes('upa') || especialidades.includes('urgencia') || especialidades.includes('emergencia')) return 'UPA / Urgência';
            if (nome.includes('farmacia')) return 'Farmácia';
            if (nome.includes('ubs')) return 'UBS';
            if (nome.includes('usf')) return 'USF';
            if (nome.includes('laboratorio') || nome.includes('laboratório') || nome.includes('cedic') || nome.includes('nasi') || nome.includes('fisioterapia') || nome.includes('reabilit') || nome.includes('capsad') || nome.includes('cerest') || nome.includes('visa') || nome.includes('servico social') || nome.includes('sa c') || nome.includes('pade') || nome.includes('consultorio na rua')) return 'Serviços Especializados';
            if (nome.includes('programa') || nome.includes('pad') || nome.includes('nucleo') || nome.includes('centro de referencia') || nome.includes('centro de atencao') || nome.includes('servico social') || nome.includes('vigilancia')) return 'Programas e Apoio';
            if (especialidades.includes('odontologia') || especialidades.includes('dentista')) return 'Urgência Bucal';
            if (especialidades.includes('farmacia') || especialidades.includes('medicamentos')) return 'Farmácia';
            return 'Outros Serviços';
        }

        function formatarHora(horario) {
            return horario || 'Horário não informado';
        }

        function criarTag(texto) {
            return `<span class="chip rounded-full px-2.5 py-1 text-[11px] text-slate-300">${texto}</span>`;
        }

        function renderNav(grupos) {
            const nav = document.getElementById('categoryNav');
            nav.innerHTML = '';
            Object.keys(grupos).forEach((categoria, index) => {
                const btn = document.createElement('a');
                btn.href = `#categoria-${index}`;
                btn.className = 'inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-4 py-2 text-sm text-slate-200 hover:bg-white/10';
                btn.innerHTML = `<span>${categoria}</span><span class="rounded-full bg-slate-900/80 px-2 py-0.5 text-[11px]">${grupos[categoria].length}</span>`;
                nav.appendChild(btn);
            });
        }

        function renderCatalogo() {
            const termo = document.getElementById('searchInput').value.trim().toLowerCase();
            const agrupado = {};

            todasUnidades.forEach(unidade => {
                const categoria = definirCategoria(unidade);
                const nome = (unidade.nome || '').toLowerCase();
                const endereco = (unidade.localizacao || '').toLowerCase();
                const especialidades = (unidade.especialidades || '').toLowerCase();
                const atendeFiltro = !termo || nome.includes(termo) || endereco.includes(termo) || especialidades.includes(termo);

                if (atendeFiltro) {
                    if (!agrupado[categoria]) agrupado[categoria] = [];
                    agrupado[categoria].push(unidade);
                }
            });

            const content = document.getElementById('catalogContent');
            content.innerHTML = '';
            const categoriasOrdenadas = Object.keys(categoriaConfig).filter(c => agrupado[c]);

            if (!categoriasOrdenadas.length) {
                content.innerHTML = `
                    <div class="glass rounded-3xl p-12 text-center">
                        <i class="ph ph-magnifying-glass text-5xl text-slate-500"></i>
                        <h3 class="mt-4 text-xl font-semibold">Nenhuma unidade encontrada</h3>
                        <p class="mt-2 text-slate-400">Tente outro termo na busca.</p>
                    </div>
                `;
                return;
            }

            renderNav(agrupado);

            categoriasOrdenadas.forEach((categoria, index) => {
                const unidades = agrupado[categoria];
                const config = categoriaConfig[categoria] || categoriaConfig['Outros Serviços'];
                const sec = document.createElement('section');
                sec.id = `categoria-${index}`;
                sec.className = 'category-panel';
                sec.innerHTML = `
                    <div class="mb-4 flex items-center justify-between gap-4">
                        <div>
                            <div class="flex items-center gap-3">
                                <div class="h-12 w-12 rounded-2xl bg-gradient-to-br ${config.cor} flex items-center justify-center text-white font-bold">
                                    ${categoria === 'UBS' ? 'U' : categoria === 'USF' ? 'F' : categoria === 'UPA / Urgência' ? 'U' : categoria === 'Farmácia' ? 'F' : categoria === 'COTE' ? 'C' : categoria === 'SAMU' ? 'S' : categoria === 'Urgência Bucal' ? 'B' : 'G'}
                                </div>
                                <div>
                                    <h2 class="text-2xl font-bold">${config.titulo}</h2>
                                    <p class="text-sm text-slate-400">${config.subtitulo}</p>
                                </div>
                            </div>
                        </div>
                        <span class="rounded-full border border-white/10 bg-white/5 px-3 py-1 text-sm text-slate-300">${unidades.length} unidade(s)</span>
                    </div>
                    <p class="mb-5 text-sm text-slate-400">${config.descricao}</p>
                    <div class="grid gap-5 md:grid-cols-2 xl:grid-cols-3">
                        ${unidades.map(unidade => `
                            <article class="glass card-hover rounded-3xl overflow-hidden transition-all duration-200">
                                <div class="h-44 relative bg-slate-800">
                                    <img src="${unidade.url_imagem || 'https://images.unsplash.com/photo-1579684385127-1ef15d508118?auto=format&fit=crop&w=900&q=80'}" alt="${unidade.nome}" class="h-full w-full object-cover opacity-70">
                                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/15 to-transparent"></div>
                                    <div class="absolute bottom-4 left-4 right-4 flex items-end justify-between gap-3">
                                        <span class="rounded-full bg-slate-900/80 px-3 py-1 text-xs font-semibold text-blue-200">${categoria}</span>
                                        <span class="rounded-full bg-blue-600/90 px-3 py-1 text-[11px] font-semibold text-white">${formatarHora(unidade.horario_atendimento)}</span>
                                    </div>
                                </div>
                                <div class="p-5">
                                    <h3 class="text-lg font-bold">${unidade.nome}</h3>
                                    <p class="mt-2 text-sm text-slate-400">${unidade.localizacao || 'Endereço não informado'}</p>
                                    <div class="mt-3 flex flex-wrap gap-2">
                                        ${((unidade.especialidades || '').split(',').map(x => x.trim()).filter(Boolean).slice(0, 3).map(criarTag).join(''))}
                                    </div>
                                    <div class="mt-4 flex gap-2">
                                        <a href="mapa_definitivo.html?lat=${unidade.lat}&lng=${unidade.lng}" class="inline-flex flex-1 items-center justify-center gap-2 rounded-2xl bg-blue-600 px-4 py-3 text-sm font-semibold text-white hover:bg-blue-500">
                                            <i class="ph ph-map-trifold"></i>
                                            Ver no mapa
                                        </a>
                                    </div>
                                </div>
                            </article>
                        `).join('')}
                    </div>
                `;
                content.appendChild(sec);
            });
        }

        async function carregarUnidades() {
            try {
                const response = await fetch('get_unidades.php');
                if (!response.ok) throw new Error('Falha ao carregar unidades');
                const dados = await response.json();
                todasUnidades = Array.isArray(dados) ? dados : [];
                renderCatalogo();
            } catch (error) {
                console.error(error);
                document.getElementById('catalogContent').innerHTML = `
                    <div class="glass rounded-3xl p-10 text-center">
                        <p class="text-red-300">Não foi possível carregar o catálogo no momento.</p>
                    </div>
                `;
            }
        }

        document.getElementById('searchInput').addEventListener('input', renderCatalogo);
        window.addEventListener('DOMContentLoaded', carregarUnidades);
    </script>
</body>
</html>
