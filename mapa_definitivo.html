    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Evita rolagem da página inteira */
            background-color: #0f172a;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            z-index: 0;
        }

        /* Camada de UI flutuante sobre o mapa */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Deixa o clique passar para o mapa... */
            z-index: 10;
            display: flex;
            flex-direction: column;
        }

        /* ...exceto nos elementos da interface */
        .interactive-ui {
            pointer-events: auto;
        }

        /* Painel escuro combinando com o mapa */
        .glass-panel {
            background: rgba(10, 15, 30, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }

        /* Marcador animado no mapa */
        .pulse-marker {
            width: 20px;
            height: 20px;
            background: #2563eb;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.8);
            border: 3px solid white;
        }

        .pulse-marker::after {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background: rgba(37, 99, 235, 0.4);
            border-radius: 50%;
            animation: pulse 2s infinite ease-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .animated-route path {
            stroke-linecap: round;
            stroke-dasharray: 10 12;
            animation: dash 1.2s linear infinite;
        }

        .leaflet-tooltip.unit-label-tooltip {
            background: rgba(2, 6, 23, 0.93);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f8fafc;
            box-shadow: 0 10px 25px rgba(2, 6, 23, 0.35);
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            line-height: 1.2;
            white-space: nowrap;
            pointer-events: none;
        }

        .leaflet-tooltip.unit-label-tooltip::before {
            border-top-color: rgba(2, 6, 23, 0.93);
        }

        .unit-label-tooltip[data-color] {
            border-color: rgba(255, 255, 255, 0.18);
        }

        .unit-label-tooltip[data-color]::before {
            border-top-color: var(--tooltip-color, rgba(2, 6, 23, 0.93));
        }

        @keyframes dash {
            to { stroke-dashoffset: -22; }
        }

        /* Animação do card inferior */
        .slide-up-enter {
            transform: translateY(150%);
            opacity: 0;
        }
        .slide-up-active {
            transform: translateY(0);
            opacity: 1;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); /* Curva suave estilo Voka */
        }
        
        .slide-out {
            transform: translateY(150%);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        #sidebar-overlay { transition: opacity 0.3s ease; }
        #sidebar-drawer { transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1); left:0 !important; margin-left:0 !important; }

        /* Tema claro para o mapa Leaflet: as regras gerais já vêm de css/settings.css. Só ficam as duas regras que
           são exclusivas desta página (tooltip de rótulo de unidade). */
        body.theme-light .leaflet-tooltip.unit-label-tooltip {
            background: var(--surface-strong) !important;
            border-color: var(--border) !important;
            color: var(--page-text) !important;
        }
        body.theme-light .leaflet-tooltip.unit-label-tooltip::before {
            border-top-color: var(--surface-strong) !important;
        }

    </style>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        function setActiveNavLink() {
            const currentPage = window.location.pathname.split('/').pop().toLowerCase();
            document.querySelectorAll('#sidebar-drawer a[href]').forEach((link) => {
                const href = (link.getAttribute('href') || '').toLowerCase();
                const isActive = href === currentPage;
                link.classList.toggle('bg-blue-500/10', isActive);
                link.classList.toggle('text-blue-400', isActive);
                link.classList.toggle('text-slate-300', !isActive);
                link.classList.toggle('hover:bg-white/5', !isActive);
                link.classList.toggle('font-medium', true);
            });
        }

        function openNavSidebar() {
            const overlay = document.getElementById('sidebar-overlay');
            const drawer = document.getElementById('sidebar-drawer');
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            overlay.classList.add('opacity-100');
            drawer.classList.remove('-translate-x-full');
            drawer.classList.add('translate-x-0');
        }

        function closeNavSidebar() {
            const overlay = document.getElementById('sidebar-overlay');
            const drawer = document.getElementById('sidebar-drawer');
            overlay.classList.add('opacity-0', 'pointer-events-none');
            overlay.classList.remove('opacity-100');
            drawer.classList.add('-translate-x-full');
            drawer.classList.remove('translate-x-0');
        }

        window.openNavSidebar = openNavSidebar;
        window.closeNavSidebar = closeNavSidebar;
        setActiveNavLink();

        // ===== MAPA =====
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false,
            zoomSnap: 0.25,
            zoomDelta: 0.25,
            wheelPxPerZoomLevel: 90,
            zoomAnimation: true
        }).setView([-22.7338, -47.6476], 13);
        
        let currentTileLayer = null;
        
        // Função para mudar tema do mapa
        function updateMapTheme() {
            const isLightTheme = document.body.classList.contains('theme-light');
            const tileUrl = isLightTheme 
                ? 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png'
                : 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
            
            // Remove a tile layer anterior
            if (currentTileLayer) {
                map.removeLayer(currentTileLayer);
            }
            
            // Adiciona a nova tile layer
            currentTileLayer = L.tileLayer(tileUrl, { maxZoom: 19 }).addTo(map);
        }
        
        // Inicializa o mapa com o tema atual
        updateMapTheme();
        
        // Monitora mudanças de tema
        const observer = new MutationObserver(() => {
            updateMapTheme();
        });
        
        observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });
        
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // ===== ESTADO (DINÂMICO) =====
        let healthUnits = []; 
        let mapFilter = 'todos';
        let searchTerm = '';
        let allMarkers = [];
        let currentMarker = null;
        let usuarioLocalizacao = null;
        let userMarker = null;
        let routeLayer = null;
        let routeStartMarker = null;
        let routeDestMarker = null;
        let routeActiveUnit = null;
        let travelMode = 'carro';
        const MIN_LABEL_ZOOM = 14;

        // ===== CORES POR TIPO =====
        const typeColors = { 
            'UBS':'#3b82f6',
            'USF':'#10b981',
            'Urgência':'#f97316',
            'Farmácia':'#22c55e',
            'Psicologia':'#a855f7'
        };

        // 1. BUSCAR DADOS DO BANCO
        async function carregarDadosDoBanco() {
            try {
                const response = await fetch('get_unidades.php');
                const dados = await response.json();

                // Converte os dados do PHP para o objeto que o seu script usa
                healthUnits = dados.map(u => ({
                    id: u.id,
                    name: u.nome,
                    address: u.localizacao,
                    lat: parseFloat(u.lat),
                    lng: parseFloat(u.lng),
                    contato: u.contato || u.contato || '',
                    rating: 4.5,
                    reviews: Math.floor(Math.random() * 200) + 50,
                    status: (u.horario_atendimento && u.horario_atendimento.includes("24")) ? "24 Horas" : "Aberto",
                    time: u.horario_atendimento || "08h - 17h",
                    tags: u.especialidades ? u.especialidades.split(',').map(t => t.trim()) : [],
                    type: determinarTipo(u.nome, u.especialidades)
                }));

                // Inicializa os marcadores SOMENTE após os dados chegarem
                initMarkers();
                // Se a página foi aberta a partir do botão "Ver no Mapa" com lat/lng,
                // tenta localizar e abrir o cartão da unidade correspondente.
                const params = new URLSearchParams(window.location.search);
                const latp = params.get('lat'), lngp = params.get('lng');
                if (latp && lngp) {
                    const latN = parseFloat(latp), lngN = parseFloat(lngp);
                    const matched = healthUnits.find(u => Math.abs(u.lat - latN) < 0.0005 && Math.abs(u.lng - lngN) < 0.0005);
                    if (matched) {
                        setTimeout(() => openUnitCard(matched), 600);
                    } else {
                        map.setView([latN, lngN], 15);
                    }
                }
            } catch (error) {
                console.error("Erro ao carregar dados do banco:", error);
            }
        }

        function determinarTipo(nome, especialidades = '') {
            const texto = `${nome} ${especialidades}`.toUpperCase();

            if (texto.includes('UPA') ||
                texto.includes('URGÊNCIA') ||
                texto.includes('URGENCIA') ||
                texto.includes('EMERGÊNCIA') ||
                texto.includes('EMERGENCIA') ||
                texto.includes('SAMU') ||
                texto.includes('SUB') ||
                texto.includes('COT') ||
                texto.includes('PRONTO SOCORRO') ||
                texto.includes('ATENDIMENTO PRÉ-HOSPITALAR') ||
                texto.includes('ATENDIMENTO PRE-HOSPITALAR')) {
                return 'Urgência';
            }

            if (texto.includes('USF')) return 'USF';
            if (texto.includes('FARMÁCIA') || texto.includes('FARMACIA')) return 'Farmácia';
            if (texto.includes('PSICO') ||
                texto.includes('PSIQUI') ||
                texto.includes('CAPS') ||
                texto.includes('PSICOSSOCIAL') ||
                texto.includes('PSICOLOG')) {
                return 'Psicologia';
            }

            if (texto.includes('UBS')) return 'UBS';
            return 'UBS';
        }

        const logoBasePath = 'img/Raekwon%20Sampaio%204%C2%B0Info-2026';
        const cardLogosPorTipo = {
            UBS: `${logoBasePath}/UBS_logotipo.png`,
            USF: `${logoBasePath}/USF_logotipo.png`,
            'Urgência': `${logoBasePath}/UPA_logotipo.png`,
            Farmácia: `${logoBasePath}/Farm%C3%A1cia_logotipo.png`,
            Psicologia: `${logoBasePath}/psicologia_logotipo.png`
        };

        function getUnitCardLogo(unit) {
            const nome = String(unit?.name || '').toUpperCase();
            if (nome.includes('SAMU')) return 'img/Samu192.png';
            return cardLogosPorTipo[unit?.type] || 'https://images.unsplash.com/photo-1584515933487-779824d29309?auto=format&fit=crop&w=900&q=80';
        }

        function createIcon(type, active = false) {
            const color = typeColors[type] || '#3b82f6';
            const size = active ? 26 : 18;
            return L.divIcon({
                className: '',
                html: `<div style="width:${size}px;height:${size}px;background:${color};border-radius:50%;border:3px solid rgba(255,255,255,0.7);box-shadow:0 0 10px ${color}99;transition:all .2s"></div>`,
                iconSize: [size, size],
                iconAnchor: [size/2, size/2]
            });
        }

        function syncMarkerLabels() {
            const currentZoom = map.getZoom();

            if (currentZoom < MIN_LABEL_ZOOM) {
                allMarkers.forEach(({ marker }) => {
                    const tooltip = marker.getTooltip();
                    const tooltipEl = tooltip?.getElement();
                    if (tooltipEl) tooltipEl.style.display = 'none';
                });
                return;
            }

            const visibleMarkers = allMarkers.filter(({ marker }) => map.hasLayer(marker));
            const markerPoints = visibleMarkers.map(({ marker }) => ({
                marker,
                point: map.latLngToContainerPoint(marker.getLatLng())
            }));

            const labelThreshold = Math.max(140, 120 + (currentZoom - MIN_LABEL_ZOOM) * 20);

            markerPoints.forEach(({ marker, point }) => {
                const tooltip = marker.getTooltip();
                const tooltipEl = tooltip?.getElement();
                if (!tooltipEl) return;

                let canShow = true;

                for (const other of markerPoints) {
                    if (other.marker === marker) continue;

                    const dx = point.x - other.point.x;
                    const dy = point.y - other.point.y;
                    const distance = Math.hypot(dx, dy);

                    if (distance < labelThreshold) {
                        canShow = false;
                        break;
                    }
                }

                tooltipEl.style.display = canShow ? '' : 'none';
            });
        }

        function mostrarToast(mensagem, tipo = 'info') {
            const toast = document.createElement('div');
            const colorMap = {
                success: 'bg-emerald-500/90 text-white',
                error: 'bg-red-500/90 text-white',
                info: 'bg-slate-800/90 text-slate-100'
            };
            toast.className = `fixed bottom-6 right-6 z-50 rounded-2xl px-4 py-3 shadow-2xl shadow-slate-950/30 ${colorMap[tipo] || colorMap.info}`;
            toast.textContent = mensagem;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3200);
        }

        function setTravelMode(mode) {
            travelMode = mode;
            const modeMap = {
                carro: 'mode-car',
                moto: 'mode-moto',
                caminhada: 'mode-walk'
            };
            Object.values(modeMap).forEach(id => {
                const btn = document.getElementById(id);
                if (!btn) return;
                btn.classList.remove('bg-slate-700', 'text-white', 'border-white/20');
                btn.classList.add('bg-slate-800/70', 'text-slate-200', 'border-slate-700');
            });
            const activeButton = document.getElementById(modeMap[mode]);
            if (activeButton) {
                activeButton.classList.remove('bg-slate-800/70', 'text-slate-200', 'border-slate-700');
                activeButton.classList.add('bg-slate-700', 'text-white', 'border-white/20');
            }
            if (routeActiveUnit) {
                iniciarRota(routeActiveUnit.id);
            }
        }

        function getTravelProfile() {
            if (travelMode === 'caminhada') return 'walking';
            return 'driving';
        }

        async function obterLocalizacaoUsuario() {
            if (!navigator.geolocation) {
                mostrarToast('Geolocalização não suportada neste navegador', 'error');
                return;
            }

            return new Promise((resolve) => {
                navigator.geolocation.getCurrentPosition(
                    position => {
                        const { latitude, longitude } = position.coords;
                        usuarioLocalizacao = { lat: latitude, lng: longitude };
                        if (userMarker) map.removeLayer(userMarker);
                        userMarker = L.circleMarker([latitude, longitude], {
                            radius: 9,
                            fillColor: '#06b6d4',
                            fillOpacity: 0.9,
                            color: '#ffffff',
                            weight: 2
                        }).addTo(map).bindPopup('Sua localização');
                        resolve();
                    },
                    error => {
                        console.warn('Erro na geolocalização:', error);
                        mostrarToast('Não foi possível obter sua localização. Verifique permissão do navegador.', 'error');
                        resolve();
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            });
        }

        function formatarDistancia(metros) {
            if (metros == null || isNaN(metros)) return 'N/A';
            return `${(metros / 1000).toFixed(1)} km`;
        }

        function formatarDuracao(segundos) {
            if (segundos == null || isNaN(segundos)) return 'N/A';
            const minutos = Math.floor(segundos / 60);
            const segs = Math.round(segundos % 60);
            return minutos === 0 ? `${segs}s` : `${minutos}min ${segs}s`;
        }

        async function calcularRotaOSRM(origem, destino) {
            const coordenadas = `${origem.lng},${origem.lat};${destino.lng},${destino.lat}`;
            const perfil = getTravelProfile();
            const url = `https://router.project-osrm.org/route/v1/${perfil}/${coordenadas}?overview=full&geometries=geojson&steps=true&annotations=duration,distance`;
            try {
                const response = await Promise.race([
                    fetch(url),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout na requisição OSRM')), 10000))
                ]);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const dados = await response.json();
                if (dados.code !== 'Ok' || !dados.routes || !dados.routes[0]) {
                    throw new Error(`OSRM: ${dados.message || dados.code || 'rota não encontrada'}`);
                }
                const rota = dados.routes[0];
                if (!rota.geometry || !rota.geometry.coordinates) {
                    throw new Error('Rota inválida: coordenadas não retornadas');
                }
                // Ajustar duração segundo o modo selecionado (moto pode ser mais rápido que carro)
                let duracao = rota.duration; // em segundos, conforme retornado pelo OSRM
                // Aplicar multiplicadores suaves quando usamos o perfil 'driving' para diferenciar moto/car
                if (travelMode === 'moto') {
                    duracao = Math.round(duracao * 0.90); // assumir ~10% mais rápido para motos
                } else if (travelMode === 'carro') {
                    duracao = Math.round(duracao * 1.00);
                }

                return {
                    coordenadas: rota.geometry.coordinates,
                    distancia: rota.distance,
                    duracao: duracao,
                    instrucoes: rota.legs
                };
            } catch (erro) {
                throw new Error(`Falha ao calcular rota: ${erro.message}`);
            }
        }

        function limparRota() {
            if (routeLayer) {
                map.removeLayer(routeLayer);
                routeLayer = null;
            }
            if (routeStartMarker) {
                map.removeLayer(routeStartMarker);
                routeStartMarker = null;
            }
            if (routeDestMarker) {
                map.removeLayer(routeDestMarker);
                routeDestMarker = null;
            }
            routeActiveUnit = null;
            document.getElementById('route-summary').classList.add('hidden');
        }

        function desenharRota(rota, unit) {
            limparRota();
            const pontos = rota.coordenadas.map(coord => [coord[1], coord[0]]);
            routeLayer = L.polyline(pontos, {
                className: 'animated-route',
                color: '#38bdf8',
                weight: 6,
                opacity: 0.85,
                lineCap: 'round',
                dashArray: '10, 12'
            }).addTo(map);

            routeStartMarker = L.circleMarker([usuarioLocalizacao.lat, usuarioLocalizacao.lng], {
                radius: 8,
                fillColor: '#22c55e',
                fillOpacity: 0.9,
                color: '#ffffff',
                weight: 2
            }).addTo(map).bindPopup('Início');

            routeDestMarker = L.circleMarker([unit.lat, unit.lng], {
                radius: 8,
                fillColor: '#f97316',
                fillOpacity: 0.9,
                color: '#ffffff',
                weight: 2
            }).addTo(map).bindPopup(unit.name);

            const bounds = L.latLngBounds(pontos);
            map.fitBounds(bounds.pad(0.12));

            document.getElementById('route-distance').textContent = `Distância: ${formatarDistancia(rota.distancia)}`;
            document.getElementById('route-duration').textContent = `Tempo estimado: ${formatarDuracao(rota.duracao)}`;
            document.getElementById('route-mode').textContent = `Modo: ${travelMode === 'caminhada' ? 'Caminhada' : travelMode === 'moto' ? 'Moto' : 'Carro'}`;
            document.getElementById('route-summary').classList.remove('hidden');
        }

        async function iniciarRota(unitId) {
            if (!usuarioLocalizacao) {
                mostrarToast('Tentando obter sua localização...', 'info');
                await obterLocalizacaoUsuario();
                if (!usuarioLocalizacao) {
                    mostrarToast('Localização do usuário não disponível. Verifique permissão de geolocalização no navegador.', 'error');
                    return;
                }
            }
            const unit = healthUnits.find(u => String(u.id) === String(unitId));
            if (!unit) {
                mostrarToast('Unidade não encontrada', 'error');
                return;
            }
            try {
                mostrarToast('Calculando rota...', 'info');
                const rota = await calcularRotaOSRM(usuarioLocalizacao, { lat: unit.lat, lng: unit.lng });
                desenharRota(rota, unit);
                routeActiveUnit = unit;
                mostrarToast('Rota traçada com sucesso!', 'success');
            } catch (erro) {
                console.error(erro);
                mostrarToast(erro.message, 'error');
            }
        }

        // 2. INICIALIZAR MARCADORES (Limpando os antigos primeiro)
        function initMarkers() {
            // Limpa o mapa se já houver algo
            allMarkers.forEach(m => map.removeLayer(m.marker));
            allMarkers = [];

            healthUnits.forEach(unit => {
                if(!isNaN(unit.lat) && !isNaN(unit.lng)) {
                    const marker = L.marker([unit.lat, unit.lng], { icon: createIcon(unit.type) });
                    const tooltipColor = typeColors[unit.type] || '#3b82f6';
                    marker.bindTooltip(unit.name, {
                        permanent: true,
                        direction: 'top',
                        offset: [0, -8],
                        className: 'unit-label-tooltip'
                    });
                    marker.getTooltip().setContent(`<span style="color:${tooltipColor};">${unit.name}</span>`);
                    marker.getTooltip().getElement()?.style.setProperty('--tooltip-color', tooltipColor);
                    marker.getTooltip().getElement()?.setAttribute('data-color', tooltipColor);
                    marker.on('click', () => openUnitCard(unit));
                    allMarkers.push({ unit, marker });
                }
            });
            aplicarFiltrosMapa(); // Isso vai desenhar os marcadores permitidos e a sidebar
        }

        // ===== INTERAÇÕES =====
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-[280px]');
            sidebar.classList.toggle('translate-x-0');
        }

        function setMapFilter(type) {
            mapFilter = type;
            document.querySelectorAll('.mf-btn').forEach(b => {
                b.classList.remove('border-blue-500/40','bg-blue-500/15','text-blue-400');
                b.classList.add('border-white/10','bg-white/5','text-slate-300');
            });
            const idMap = {
                'todos':'mf-todos',
                'UBS':'mf-ubs',
                'USF':'mf-usf',
                'Urgência':'mf-urgencia',
                'Farmácia':'mf-farmacia',
                'Psicologia':'mf-psicologia'
            };
            const btn = document.getElementById(idMap[type]);
            if (btn) btn.classList.add('border-blue-500/40','bg-blue-500/15','text-blue-400');
            aplicarFiltrosMapa();
        }

        function filtrarMapa() {
            searchTerm = (document.getElementById('map-search').value || '').toLowerCase().trim();
            aplicarFiltrosMapa();
        }

        function aplicarFiltrosMapa() {
            const filtered = healthUnits.filter(u => {
                const matchType = mapFilter === 'todos' || u.type === mapFilter;
                const matchSearch = !searchTerm || u.name.toLowerCase().includes(searchTerm) || u.tags.some(t => t.toLowerCase().includes(searchTerm)) || u.address.toLowerCase().includes(searchTerm);
                return matchType && matchSearch;
            });

            const filteredIds = new Set(filtered.map(u => u.id));
            allMarkers.forEach(({ unit, marker }) => {
                if (filteredIds.has(unit.id)) marker.addTo(map); 
                else map.removeLayer(marker);
            });
            renderSidebarList(filtered);
            syncMarkerLabels();
        }

        function renderSidebarList(lista) {
            const container = document.getElementById('sidebar-unit-list');
            if(!container) return;
            container.innerHTML = '';
            if (!lista.length) { container.innerHTML = '<p class="text-slate-500 text-xs text-center py-4">Nenhuma unidade encontrada.</p>'; return; }
            
            lista.forEach(unit => {
                const color = typeColors[unit.type] || '#3b82f6';
                const div = document.createElement('div');
                div.className = 'flex items-start gap-3 px-3 py-2.5 rounded-xl cursor-pointer hover:bg-white/5 transition-all border border-transparent hover:border-white/10';
                div.innerHTML = `<div class="w-2.5 h-2.5 rounded-full flex-shrink-0 mt-1.5" style="background:${color};box-shadow:0 0 6px ${color}88"></div><div class="min-w-0"><p class="text-sm font-semibold text-slate-100 leading-tight truncate">${unit.name}</p><p class="text-xs text-slate-500 mt-0.5">${unit.type} · ${unit.status}</p></div>`;
                div.onclick = () => openUnitCard(unit);
                container.appendChild(div);
            });
        }

        // ===== CARD DE DETALHES =====
        const card = document.getElementById('unit-card');
        const closeBtn = document.getElementById('close-card');

        function openUnitCard(unit) {
            if (currentMarker) {
                const prev = allMarkers.find(m => m.marker === currentMarker);
                if (prev) prev.marker.setIcon(createIcon(prev.unit.type));
            }
            const found = allMarkers.find(m => m.unit.id === unit.id);
            if (found) { found.marker.setIcon(createIcon(unit.type, true)); currentMarker = found.marker; }

            map.flyTo([unit.lat - 0.003, unit.lng], 15, { duration: 1.2 });

            document.getElementById('unit-name').textContent = unit.name;
            document.getElementById('unit-address').textContent = unit.address;
            document.getElementById('unit-rating').textContent = unit.rating;
            document.getElementById('unit-reviews').textContent = `(${unit.reviews} avaliações)`;
            document.getElementById('unit-time-badge').innerHTML = `<i class="ph-fill ph-clock"></i> ${unit.time}`;

            const badge = document.getElementById('unit-status-badge');
            if (unit.status === '24 Horas') {
                badge.className = 'bg-blue-900/50 text-blue-400 text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1';
                badge.innerHTML = '<span class="w-1.5 h-1.5 bg-blue-400 rounded-full animate-pulse"></span> 24 HORAS';
            } else {
                badge.className = 'bg-emerald-900/50 text-emerald-400 text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1';
                badge.innerHTML = '<span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span> ABERTO';
            }

            const iconContainer = document.getElementById('unit-icon-container');
            const iconDefault = document.getElementById('unit-icon-default');
            const unitLogo = getUnitCardLogo(unit);

            if (unitLogo) {
                iconContainer.className = 'w-24 h-24 rounded-2xl bg-white/5 flex items-center justify-center flex-shrink-0 border border-white/10 overflow-hidden';
                iconContainer.innerHTML = `<img src="${unitLogo}" alt="${unit.name}" class="w-full h-full object-contain p-2">`;
            } else {
                iconContainer.className = 'w-24 h-24 rounded-2xl bg-gradient-to-br from-blue-900/80 to-indigo-900/80 flex items-center justify-center flex-shrink-0 border border-white/10 overflow-hidden';
                iconContainer.innerHTML = '';
                iconContainer.appendChild(iconDefault);
                iconDefault.className = 'ph-fill ph-hospital text-4xl text-blue-400';
            }

            const tagsContainer = document.getElementById('unit-tags');
            tagsContainer.innerHTML = unit.tags.map(t => `<span class="bg-slate-700/60 text-slate-300 text-xs px-2.5 py-1 rounded-md font-medium border border-white/10">${t}</span>`).join('');

            const startButton = document.getElementById('btn-start-route');
            if (startButton) {
                startButton.onclick = () => iniciarRota(unit.id);
            }
            const copyBtn = document.getElementById('btn-copy-phone');
            const phoneSpan = document.getElementById('btn-phone-number');
            if (copyBtn) {
                const phone = unit.contato || unit.contato || '';
                if (phoneSpan) phoneSpan.textContent = phone;
                copyBtn.onclick = async () => {
                    try {
                        await navigator.clipboard.writeText(phone);
                        mostrarToast('Número copiado para a área de transferência', 'success');
                    } catch (e) {
                        mostrarToast('Não foi possível copiar o número', 'error');
                    }
                };
            }

            card.classList.remove('slide-up-enter','slide-out');
            card.classList.add('slide-up-active');
        }

        function hideCard() {
            card.classList.remove('slide-up-active');
            card.classList.add('slide-out');
            if (currentMarker) {
                const prev = allMarkers.find(m => m.marker === currentMarker);
                if (prev) prev.marker.setIcon(createIcon(prev.unit.type));
                currentMarker = null;
            }
        }

        closeBtn.addEventListener('click', hideCard);
        map.on('click', hideCard);
        map.on('zoom', syncMarkerLabels);
        map.on('move', syncMarkerLabels);

        // ===== INICIAR TUDO =====
        setTravelMode('carro');
        obterLocalizacaoUsuario();
        carregarDadosDoBanco();
    </script>
